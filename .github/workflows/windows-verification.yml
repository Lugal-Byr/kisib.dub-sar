name: Windows build and verification
on:
  push:
    branches: ['codex/windows-verification-2026-10-07']
  pull_request:
    branches: ['main']
permissions:
  contents: read
concurrency:
  group: kisib-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, exact revision already exercised
        with:
          persist-credentials: false
      - name: Compile and run Windows tests
        shell: powershell
        run: ./kisib-dub-sar-v0.1/tests/ci-windows.ps1
      - name: Retain build and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, exact revision already exercised
        with:
          name: kisib-verification-${{ matrix.runner }}
          path: kisib-dub-sar-v0.1/test-results/
          if-no-files-found: error
          retention-days: 7
