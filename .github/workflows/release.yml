name: Release
on:
  push:
    branches: ['main']
    paths: ['kisib-dub-sar-v0.1/**', '.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, same revision as windows-verification.yml
        with:
          persist-credentials: false
      - name: Build kisib.dub-sar.exe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'kisib-dub-sar-v0.1'
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $tag = "v0.2.$env:GITHUB_RUN_NUMBER"
          $out = "out\kisib.dub-sar-$tag"
          New-Item -ItemType Directory -Force $out | Out-Null
          $refs = @('System.dll','System.Core.dll','System.Security.dll','System.Runtime.Serialization.dll','System.Xml.dll','System.Drawing.dll','System.Windows.Forms.dll') | ForEach-Object { "/reference:$_" }
          Set-Content -Path "$p\src\BuildVersion.cs" -Encoding ASCII -Value @(('[assembly: System.Reflection.AssemblyFileVersion("0.2.{0}.0")]' -f $env:GITHUB_RUN_NUMBER), ('[assembly: System.Reflection.AssemblyInformationalVersion("{0}")]' -f $tag))
          $src = @(Get-ChildItem "$p\src\*.cs" | Select-Object -ExpandProperty FullName)
          & $csc /nologo /target:winexe /platform:anycpu /optimize+ "/win32manifest:$p\app.manifest" "/win32icon:$p\assets\kisib.ico" "/resource:$p\assets\kisib.ico,Kisib.kisib.ico" "/out:$out\kisib.dub-sar.exe" @refs @src
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          Copy-Item -Recurse "$p\data", "$p\docs", "$p\README.txt", "LICENSE" $out
          Set-Content -Path "$out\version.txt" -Value $tag -Encoding ASCII
          Compress-Archive -Path $out -DestinationPath "out\kisib.dub-sar-$tag-windows.zip"
      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.2.$env:GITHUB_RUN_NUMBER"
          gh release create $tag "out\kisib.dub-sar-$tag-windows.zip" --target $env:GITHUB_SHA --latest --title "kisib.dub-sar $tag" --notes "GETTIN' ROLLED SINCE -2199. kisib.dub-sar by S-CORP-i0N. Free for personal use with credit (PolyForm Noncommercial 1.0.0, see LICENSE); commercial use needs a license from S-CORP-ION. Windows build. Download the zip, Extract All, double-click kisib.dub-sar.exe. Unsigned: if Windows warns, click More info then Run anyway."
