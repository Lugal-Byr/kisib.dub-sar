name: Self-test on Windows (temporary branch)
on:
  push:
    branches: ['claude/selftest']
permissions:
  contents: read
concurrency:
  group: kisib-selftest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, same revision as release.yml
        with:
          persist-credentials: false
      - name: Build kisib.dub-sar.exe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'kisib-dub-sar-v0.1'
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $out = 'out\kisib'
          New-Item -ItemType Directory -Force $out | Out-Null
          $refs = @('System.dll','System.Core.dll','System.Security.dll','System.Runtime.Serialization.dll','System.Xml.dll','System.Drawing.dll','System.Windows.Forms.dll') | ForEach-Object { "/reference:$_" }
          $src = @(Get-ChildItem "$p\src\*.cs" | Select-Object -ExpandProperty FullName)
          & $csc /nologo /target:winexe /platform:anycpu /optimize+ "/win32manifest:$p\app.manifest" "/win32icon:$p\assets\kisib.ico" "/resource:$p\assets\kisib.ico,Kisib.kisib.ico" "/resource:$p\assets\seals.pem,Kisib.seals.pem" "/out:$out\kisib.dub-sar.exe" @refs @src
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          Copy-Item -Recurse "$p\data", "$p\docs", "$p\README.txt", "LICENSE" $out
          Set-Content -Path "$out\version.txt" -Value "v0.2.selftest" -Encoding ASCII
      - name: Screen
        shell: powershell
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "Set-DisplayResolution: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host ([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)
          Write-Host ("interactive: " + [Environment]::UserInteractive + "  session: " + (Get-Process -Id $PID).SessionId)
      - name: Run kisib's self-test
        shell: powershell
        run: |
          $env:KISIB_SELFTEST = 'yes'
          $exe = (Resolve-Path 'out\kisib\kisib.dub-sar.exe').Path
          $outDir = Join-Path $PWD 'selftest-out'
          $proc = Start-Process -FilePath $exe -ArgumentList '--selftest', "`"$outDir`"" -PassThru
          $null = $proc.Handle
          if (-not $proc.WaitForExit(45 * 60 * 1000)) { $proc.Kill(); Write-Host 'self-test timed out' }
          if (Test-Path "$outDir\selftest.log") { Get-Content "$outDir\selftest.log" -Encoding UTF8 | Select-Object -Last 150 }
          Write-Host "exit code $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { exit 1 }
      - name: Keep the log and pictures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, same revision as windows-verification.yml
        with:
          name: kisib-selftest-${{ matrix.runner }}
          path: selftest-out/
          if-no-files-found: warn
          retention-days: 3
